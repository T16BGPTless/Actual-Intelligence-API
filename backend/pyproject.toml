[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pylint.main]
ignore-paths = ["venv", ".venv"]

[tool.pylint.basic]
good-names = ["chatID"]

[tool.pylint."messages control"]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "too-few-public-methods",
  "duplicate-code",
  "too-many-return-statements",
  "no-member",
]

[tool.pylint.format]
max-line-length = 120
