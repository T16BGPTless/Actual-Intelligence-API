  /v1/responder/chats:
    get:
      tags: [Responder side]
      summary: list your chats.
      description: lists all the chats belonging to a responder. can be filtered by categories with params

      parameters:
        - $ref: "#/components/parameters/AccessToken"
        - in: query
          name: categories 
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: |
            Filters chats by categories.
            Provide multiple values as a comma-separated list.
      responses:
        "200":
          description: |
            **OK**
            
            Returns an array of chats.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSummary"
              example:
                - chatID: 12345
                  title: My Cool Website
                  originalRequest: Create a website for my online store.
                  category: development
                  status: open
                  tokens: 30
                  createdAt: "2025-08-14T10:30:00Z"
                - chatID: 54321
                  title: Poem About The Sea
                  originalRequest: Write me a poem about the sea.
                  category: writing
                  status: closed
                  tokens: 40
