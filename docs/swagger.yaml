  /v1/responder/chats/{chatID}/claim:
    post:
      tags: [Responder side]
      summary: claim a chat
      description: |
        Claims an unclaimed chat so the responder can work on it so multiple people don't work on the same job.

      parameters:
        - $ref: "#/components/parameters/AccessToken"
        - $ref: "#/components/parameters/ChatId"
        
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimChatRequest"

      responses:
        "200":
          description: |
            **OK**
            
            Returns the claimed chat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"

        "400":
          description: |
            **Bad Request**
            
            Chat cannot be claimed or missing chat title.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                BAD_REQUEST:
                  summary: BAD_REQUEST
                  value:
                    error: BAD_REQUEST
                    message: "Missing or invalid claim data: missing field: title"

        "401":
          description: |
            **Unauthorized**
            
            Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHORIZED:
                  summary: UNAUTHORIZED
                  value:
                    error: UNAUTHORIZED
                    message: The API token is missing or invalid. If you do not have an API token register for one through the form on our website

        "403":
          description: |
            **Forbidden**
            
            You do not have access to claim chats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                FORBIDDEN:
                  summary: FORBIDDEN
                  value:
                    error: FORBIDDEN
                    message: You do not have access to this content

        "404":
          description: |
            **Not Found**
            
            ChatID does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                NOT_FOUND:
                  summary: NOT_FOUND
                  value:
                    error: NOT_FOUND
                    message: The requested resource was not found

        "409":
          description: |
            **Conflict**
            
            Chat has already been claimed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                CONFLICT:
                  summary: CONFLICT
                  value:
                    error: CONFLICT
                    message: This chat has already been claimed

        "500":
          description: |
