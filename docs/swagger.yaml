components:

  securitySchemes:
    AccessTokenAuth:
      type: apiKey
      in: header
      name: AccessToken

  parameters:
    ChatId:
      name: chatID
      in: path
      required: true
      schema:
        type: string
      description: chatID
      
    AccessToken:
      name: AccessToken
      in: header
      required: true
      schema:
        type: string
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
      description: AccessToken
      

  schemas:
    CreateChatRequest:
      type: object
      properties:
        requestText:
          type: string
          example: Create a website for my online store.
        category:
          type: string
          example: writing
        tokensToSpend:
          type: number
          example: 40
      required:
        - requestText

    ClaimChatRequest:
      type: object
      properties:
        title:
          type: string
          example: My Cool Website
      required:
        - title

    RequesterMessageRequest:
      type: object
      properties:
        message:
          type: string
          example: could you resize the title please.
        tokensToSpend:
          type: number
          example: 0
          description: "0 for normal message, > 0 to create a new request."
      required:
        - message

    ResponderMessageRequest:
      type: object
      properties:
        message:
          type: string
          example: here is the revised version.
      required:
        - message

    ReviewChatRequest:
      type: object
      properties:
        resolved:
          type: boolean
          example: true
          description: did this resolve your request
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
          description: 1-5 stars
      required:
        - resolved
        - rating

    ChatSummary:
      type: object
      properties:
        chatID:
          type: string
          example: 12345
        title:
          type: string
          nullable: true
          example: My Cool Website
        originalRequest:
          type: string
          example: Create a website for my online store.
        category:
          type: string
          example: writing
        status:
          type: string
          example: open
        Tokens:
          type: number
          example: 30
        createdAt:
          type: string
          format: date-time
          example: "2025-08-14T10:30:00Z"

    Message:
      type: object
      properties:
        senderType:
          type: string
          example: requester
        message:
          type: string
          example: Please make the tone more professional.
        tokens:
          type: number
          example: 0
        createdAt:
          type: string
          format: date-time
          example: "2025-08-14T10:35:00Z"

    Chat:
      type: object
      properties:
        chatID:
          type: string
          example: 12345
        title:
          type: string
          nullable: true
          example: My Cool Website
        requesterUsername:
          type: string
          example: Guy
        responderUsername:
          type: string
          nullable: true
          example: John
        status:
          type: string
          example: open
        originalRequest:
          type: string
          example: Create a website for my online store.
        tokensSpent:
          type: number
          example: 40
        createdAt:
          type: string
          format: date-time
          example: "2025-08-14T10:30:00Z"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          example: Guy
        username:
          type: string
          example: cool_guy
        email:
          type: string
          format: email
          example: sam@example.com
        password:
          type: string
          format: password
          example: mySecurePassword123
      required:
        - name
        - email
        - password
        - username

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: guy@example.com
        password:
          type: string
          format: password
          example: mySecurePassword123
      required:
        - email
        - password

    User:
      type: object
      properties:
        username:
          type: string
          example: cool_guy
        name:
          type: string
          example: Guy
        email:
          type: string
          format: email
          example: guy@example.com
        createdAt:
          type: string
          format: date-time
          example: "2026-04-03T10:30:00Z"
        lastOnline:
          type: string
          format: date-time
          nullable: true
          example: "2026-04-14T09:30:00Z"

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Access token for authenticated requests.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        user:
          $ref: "#/components/schemas/User"

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
          