openapi: 3.0.3
info:
  title: GPTless Actual Intelligence API
  version: 1.0.0

servers:
  - url: https://api.gptless.au
  - url: https://preview.gptless.au

tags:
  - name: Requester side
    description: Endpoints for requesters
  - name: Responder side
    description: Endpoints for responders
  - name: Tokens
    description: Token management
  - name: Auth
    description: Auth Endpoints
security:
  - AccessTokenAuth: []


paths:
  /v1/requester/chats:
    post:
      tags: [Requester side]
      summary: create a new chat with initial request
      description: |
        Creates a new chat and submits the initial request.

      parameters:
        - $ref: "#/components/parameters/AccessToken"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatRequest"

      responses:
        "201":
          description: |
            **Created**
            
            Returns the newly created chatID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"

        "400":
          description: |
            **Bad Request**
            
            Missing or invalid chat data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                BAD_REQUEST:
                  summary: BAD_REQUEST
                  value:
                    error: BAD_REQUEST
                    message: "Missing or invalid chat data: missing field: requestText"

        "401":
          description: |
            **Unauthorized**
            
            Missing or invalid API token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHORIZED:
                  summary: UNAUTHORIZED
                  value:
                    error: UNAUTHORIZED
                    message: The API token is missing or invalid. If you do not have an API token register for one through the form on our website

        "403":
          description: |
            **Forbidden**
            
            You do not have access to create chats.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                FORBIDDEN:
                  summary: FORBIDDEN
                  value:
                    error: FORBIDDEN
                    message: You do not have access to this content

        "500":
          description: |
            **Internal Server Error**
            
            There was an internal server error. If this persists contact us at contact@gptless.au.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INTERNAL_SERVER_ERROR:
                  summary: INTERNAL_SERVER_ERROR
                  value:
                    error: INTERNAL_SERVER_ERROR
                    message: An internal server error occurred.
    get:
      tags: [Requester side]
      summary: Lists chats
      description: Provides a list of chats that the requester has made.

      parameters:
        - $ref: "#/components/parameters/AccessToken"

      responses:
        "200":
          description: |
            **OK**
            
            Returns an array of chats.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSummary"
              example:
                - chatID: 12345
                  title: My Cool Website
                  originalRequest: Create a website for my online store.
                  category: development
                  status: open
                  tokens: 30
                  createdAt: "2025-08-14T10:30:00Z"
                - chatID: 54321
                  title: Poem About The Sea
                  originalRequest: Write me a poem about the sea.
                  category: writing
                  status: closed
                  tokens: 40
                  createdAt: "2025-08-13T09:00:00Z"

        "401":
          description: |
            **Unauthorized**
            
            Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHORIZED:
                  summary: UNAUTHORIZED
                  value:
                    error: UNAUTHORIZED
                    message: The API token is missing or invalid. If you do not have an API token register for one through the form on our website

        "500":
          description: |
            **Internal Server Error**
            
            There was an internal server error. If this persists contact us at contact@gptless.au.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INTERNAL_SERVER_ERROR:
                  summary: INTERNAL_SERVER_ERROR
                  value:
                    error: INTERNAL_SERVER_ERROR
                    message: An internal server error occurred.

  /v1/requester/chats/{chatID}:
    parameters:
      - $ref: "#/components/parameters/AccessToken"
      - $ref: "#/components/parameters/ChatId"

    get:
      tags: [Requester side]
      summary: get a chat
      description: Given a valid chatID, returns the full chat.
      responses:
        "200":
          description: |
            **OK**

            Returns the chat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"

        "401":
          description: |
            **Unauthorized**
            
            Missing or invalid API token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UNAUTHORIZED:
                  summary: UNAUTHORIZED
                  value:
                    error: UNAUTHORIZED
                    message: The API token is missing or invalid. If you do not have an API token register for one through the form on our website

        "403":
          description: |
            **Forbidden**
            
            You do not have access to this chat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                FORBIDDEN:
                  summary: FORBIDDEN
                  value:
                    error: FORBIDDEN
                    message: You do not have access to this content

        "404":
          description: |
            **Not Found**
            
            ChatID does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                NOT_FOUND:
                  summary: NOT_FOUND
                  value:
                    error: NOT_FOUND
                    message: The requested resource was not found

        "500":
          description: |
            **Internal Server Error**
            
            There was an internal server error. If this persists contact us at contact@gptless.au.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                INTERNAL_SERVER_ERROR:
